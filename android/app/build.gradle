apply plugin: 'com.android.application'

android {
    // 🔴 회사 철자는 dongsin(도메인 dongsinmarket 과 같다) — 패키지는 com.dongsin.<브랜드>mart (2026-11-13 대표님 지시).
    //    namespace 는 자바 코드(R·MainActivity)의 자리라 두 브랜드가 같이 쓴다. 기기에 깔리는 이름은 아래 productFlavors 의 applicationId.
    namespace = "com.dongsin.srmart"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 브랜드(화이트라벨) — 같은 화면 코드로 브랜드마다 앱을 따로 찍는다. 값은 brands/<id>/brand.json 과 같아야 한다
    //   🔴 applicationId 는 brands/<id>/brand.json 의 appId 가 원본이다 — 여기를 손으로 고치지 말고 brand.json 을 고친 뒤
    //      `node scripts/brand-ids.cjs --write` (strings.xml · capacitor.config.ts · src/brand.js 까지 같이 고친다 · 2026-11-16).
    //      웹 빌드의 prebuild 가 `brand-ids.cjs` 로 어긋남을 막는다.
    //   그림·색·이름: app/src/<flavor>/res (srm 은 main 그대로 · aram 은 brand/generate-android-brand.cjs 로 만든다)
    //   google-services.json: app/src/<flavor>/google-services.json (Firebase 콘솔에서 그 패키지로 받은 것)
    flavorDimensions = ["brand"]
    productFlavors {
        srm {
            dimension "brand"
            applicationId "com.dongsin.srmart"
        }
        aram {
            dimension "brand"
            applicationId "com.dongsin.arammart"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 푸시(FCM) — google-services.json 은 브랜드마다 따로: app/src/srm/ · app/src/aram/ (패키지 이름이 그 파일 안의 package_name 과 같아야 한다).
// 🔴 2026-11-13 패키지를 com.dongshin.* → com.dongsin.* 로 바꾸며 옛 app/google-services.json(com.dongshin.srmart 용)은 뺐다 —
//    옛 패키지 파일로는 새 앱이 빌드되지 않는다(「No matching client」). 새 파일을 받기 전까지는 푸시만 안 되고 앱은 빌드·실행된다.
def brandServices = ['srm', 'aram'].findAll { file("src/${it}/google-services.json").exists() }
if (brandServices) {
    apply plugin: 'com.google.gms.google-services'
    // 한 브랜드 파일만 먼저 받은 동안 다른 브랜드 빌드가 멈추지 않게 — 그 브랜드는 푸시만 빠진다(경고로 남는다)
    googleServices { missingGoogleServicesStrategy = 'WARN' }
} else {
    logger.warn("google-services.json 이 어느 브랜드에도 없다(app/src/srm · app/src/aram) — 푸시 알림 없이 빌드한다")
}
