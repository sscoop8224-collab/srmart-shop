<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- iOS 홈 화면 standalone PWA 상태바: black-translucent만 상태바 영역을 앱이 직접 칠할 수 있게
         투명 처리한다(default/black은 상태바가 OS가 그리는 별도 불투명 영역이라 웹이 못 칠함).
         이 값은 홈 화면에 추가된 시점에 스냅샷될 수 있어, 기존 아이콘은 삭제 후 재추가해야 반영됨.
         트레이드오프: black-translucent는 상태바 글자색(시계·배터리)이 항상 흰색으로 고정된다(iOS
         플랫폼 제약, JS로도 못 바꿈) — 헤더가 어두운 다크모드는 대비 OK, 라이트모드(헤더 흰색)는
         흰 글자가 흰 배경 위라 거의 안 보일 수 있음. 실기기에서 라이트모드 상태바 글자 가독성 반드시 확인. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Safari 탭/Android Chrome 주소창 틴트 — standalone 상태바에는 영향 없음(그건 위 status-bar-style
         전용). 헤더 배경(--white 토큰)과 동일값으로 라이트/다크 분기. 실제 앱 상태(다크모드 수동 토글
         포함)와 완전히 맞추는 동적 갱신은 ThemeContext.jsx의 applyDarkVars()에서 처리 — 아래 두 태그는
         JS 실행 전(첫 페인트)과 media-query-only 폴백 역할. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="에스알마트" />
<link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="description" content="에스알마트 동신마켓 - 동네 마트 온라인 쇼핑" />
    <meta name="keywords" content="동신마켓, 에스알마트, 온라인쇼핑, 동네마트, 검암" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Open Graph -->
    <meta property="og:title" content="에스알마트 동신마켓" />
    <meta property="og:description" content="동네 마트 온라인 쇼핑" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512.png" />
    <!-- iOS PWA -->
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/icons/icon-512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <title>에스알마트</title>
    <!-- 스플래시 광고 부팅시점 프리페치: 로고 스플래시가 뜨는 동안(JS/웹뷰 부팅 수 초)에 광고 이미지를 미리 받아둔다.
         저사양 기기에서 마운트 시점 다운로드 레이스 방지. 총 로딩 시간은 안 늘림(이미 걸리는 부팅 시간 활용). -->
    <script>
    (function () {
      try {
        var warm = function (u) { if (u) { var i = new Image(); i.decoding = 'async'; i.src = u; } };
        var p = localStorage.getItem('srmart_splash_ad');           // 1) 직전 회차 캐시 포인터 즉시 프리페치
        if (p) { try { var o = JSON.parse(p); if (o && o.url) warm(o.url); } catch (e) {} }
        fetch('/api/splash-ads', { headers: { Accept: 'application/json' } })  // 2) 현재 활성 광고 조기 조회 → 이미지 프리페치(첫 회차/교체 대비)
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (a) {
            if (a && a[0] && a[0].image_url) {
              var u = a[0].image_url;
              warm(/^https?:/.test(u) ? u : (location.origin + (u.charAt(0) === '/' ? u : '/' + u)));
            }
          }).catch(function () {});
      } catch (e) {}
    })();
    </script>
    <!-- 스플래시→React 마운트 사이 흰 화면 방지: 초기 배경을 앱 다크그린으로 고정 -->
    <style>html,body,#root{background-color:#077D3C;margin:0;}</style>
  </head>
  <body style="background-color:#077D3C;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
